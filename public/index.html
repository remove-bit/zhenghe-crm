<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正合CRM · 不多不少，正合所需</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 登录页 -->
<div id="login-view" class="login-page">
  <div class="login-box">
    <div class="login-brand">
      <div class="brand-mark">正</div>
      <h1>正合CRM</h1>
      <p>不多不少，正合所需 · 开箱即用的客户关系管理</p>
    </div>
    <form id="login-form">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="login-user" autocomplete="username" placeholder="请输入用户名" value="admin">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="请输入密码" value="admin123">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">登 录</button>
      <div class="login-hint">演示账号：admin / admin123　manager / manager123　sales / sales123</div>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>
  <div class="login-footer">正合CRM · 开源免费 · 数据存储在你自己的服务器</div>
</div>

<!-- 主应用 -->
<div id="app" class="app hidden">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">正</div>
      <div><strong>正合CRM</strong><span>不多不少，正合所需</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group">工作台</div>
      <a class="nav-item active" data-view="dashboard"><span class="ico">▦</span>数据概览</a>
      <a class="nav-item" data-view="tasks"><span class="ico">✓</span>待办任务<span class="badge" id="task-badge"></span></a>
      <div class="nav-group">客户管理</div>
      <a class="nav-item" data-view="customers"><span class="ico">◧</span>客户</a>
      <a class="nav-item" data-view="contacts"><span class="ico">◎</span>联系人</a>
      <a class="nav-item" data-view="leads"><span class="ico">◇</span>线索</a>
      <div class="nav-group">销售管理</div>
      <a class="nav-item" data-view="opportunities"><span class="ico">◈</span>商机</a>
      <a class="nav-item" data-view="funnel"><span class="ico">▤</span>销售漏斗</a>
      <a class="nav-item" data-view="activities"><span class="ico">◷</span>跟进记录</a>
      <div class="nav-group">分析与设置</div>
      <a class="nav-item" data-view="reports"><span class="ico">▥</span>统计报表</a>
      <a class="nav-item admin-only" data-view="users"><span class="ico">⚙</span>用户管理</a>
      <a class="nav-item admin-only" data-view="database"><span class="ico">▤</span>数据库</a>
    </nav>
    <div class="sidebar-toggle" id="sidebar-toggle">‹</div>
  </aside>

  <!-- 主内容 -->
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn">☰</button>
      <div class="topbar-title" id="page-title">数据概览</div>
      <div class="topbar-right">
        <button class="icon-btn" id="refresh-btn" title="刷新">⟳</button>
        <div class="user-menu">
          <div class="avatar" id="avatar">管</div>
          <div class="user-info">
            <strong id="user-name">管理员</strong>
            <span id="user-role">admin</span>
          </div>
          <button class="logout-btn" id="logout-btn" title="退出登录">退出</button>
        </div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- 弹窗容器 -->
<div id="modal-root"></div>
<!-- 提示容器 -->
<div id="toast-root"></div>

<script src="/app.js"></script>
</body>
</html>
